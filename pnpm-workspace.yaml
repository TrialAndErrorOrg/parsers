packages:
  - apps/*
  - libs/*
  - libs/*/*
  # Superseded by apps/converter; kept out of the workspace until someone decides its fate.
  - '!apps/converter-frontend'

# Dependency build scripts pnpm may run (pnpm 11 asks for explicit approval).
allowBuilds:
  esbuild: true

# eslint-plugin-regexp is loaded by oxlint as a JS plugin; it never needs eslint itself.
peerDependencyRules:
  ignoreMissing:
    - eslint

# Target versions for the unified ecosystem (unified 11 / unist 3 / xast 2 / mdast 4 / hast 3 /
# vfile 6). Packages reference these with `catalog:` so every lib moves in lockstep.
# Not listed on purpose: `rehype-minify-whitespace` (replaced by the workspace lib
# `xast-util-minify-whitespace`; 6.x crashes on xast) and `hast-util-whitespace` (3.x is
# hast-only; inline it), `mdast-builder` (dead, unist 2; use object literals / unist-builder).
catalog:
  # core
  unified: ^11.0.5
  vfile: ^6.0.3
  vfile-message: ^4.0.3
  vfile-reporter: ^8.1.1
  to-vfile: ^8.0.0
  # tree types
  '@types/unist': ^3.0.3
  '@types/xast': ^2.0.4
  '@types/mdast': ^4.0.4
  '@types/hast': ^3.0.5
  '@types/nlcst': ^2.0.3
  # unist utilities
  unist-builder: ^4.0.0
  unist-util-filter: ^5.0.1
  unist-util-is: ^6.0.1
  unist-util-map: ^4.0.0
  unist-util-position: ^5.0.0
  unist-util-remove: ^4.0.0
  unist-util-remove-position: ^5.0.0
  unist-util-visit: ^5.1.0
  unist-util-visit-parents: ^6.0.2
  # xast
  xast-util-from-xml: ^4.0.0
  xast-util-to-string: ^3.0.0
  xast-util-to-xml: ^4.0.0
  xastscript: ^4.0.0
  # hast / rehype
  hastscript: ^9.0.1
  hast-util-to-mdast: ^10.1.2
  rehype-parse: ^9.0.1
  rehype-remark: ^10.0.1
  # mdast / remark
  mdast-util-from-markdown: ^2.1.0
  mdast-util-gfm: ^3.1.0
  mdast-util-math: ^3.0.0
  mdast-util-phrasing: ^4.1.0
  mdast-util-to-markdown: ^2.2.0
  mdast-util-to-string: ^4.0.0
  remark: ^15.0.1
  remark-gfm: ^4.0.1
  remark-math: ^6.0.0
  remark-stringify: ^11.0.0
  remark-toc: ^9.0.0
  # Only 2.x alphas exist for unified 11; keep for the to-mdast fixture spec (devDep).
  '@benrbray/remark-cite': 2.0.1-alpha.4
  # nlcst / retext
  retext-english: ^5.0.0
  # unified-latex (1.8 ships its own types: no more patches)
  '@unified-latex/unified-latex-builder': ^1.8.4
  '@unified-latex/unified-latex-types': ^1.8.4
  '@unified-latex/unified-latex-util-render-info': ^1.8.4
  '@unified-latex/unified-latex-util-to-string': ^1.8.4

# The unist-3 era type packages depend on `@types/unist: '*'`, which pnpm happily dedupes to
# the unist 2 still in the tree. Pin them to unist 3, or e.g. xast 2's `TextData` extends unist 2's
# index-signature `Data` and nothing built on unist 3 is assignable to it.
overrides:
  '@types/xast@2>@types/unist': 'catalog:'
  '@types/mdast@4>@types/unist': 'catalog:'
  '@types/hast@3>@types/unist': 'catalog:'
  '@types/nlcst@2>@types/unist': 'catalog:'

patchedDependencies:
  '@unified-latex/unified-latex-builder@1.3.1': patches/@unified-latex__unified-latex-builder@1.3.1.patch
  '@unified-latex/unified-latex-types@1.3.1': patches/@unified-latex__unified-latex-types@1.3.1.patch
  '@unified-latex/unified-latex-util-to-string@1.3.1': patches/@unified-latex__unified-latex-util-to-string@1.3.1.patch

minimumReleaseAgeExclude:
  - '@typescript/typescript-darwin-arm64@7.1.0-dev.20261004.1'
  - '@typescript/typescript-darwin-x64@7.1.0-dev.20261004.1'
  - '@typescript/typescript-linux-arm64@7.1.0-dev.20261004.1'
  - '@typescript/typescript-linux-arm@7.1.0-dev.20261004.1'
  - '@typescript/typescript-linux-x64@7.1.0-dev.20261004.1'
  - '@typescript/typescript-win32-arm64@7.1.0-dev.20261004.1'
  - '@typescript/typescript-win32-x64@7.1.0-dev.20261004.1'
  - typescript@7.1.0-dev.20261004.1
