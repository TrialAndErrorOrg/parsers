# Versions and publishes the workspace packages with Changesets.
#
# On every push to main:
#   - pending changesets  -> open/update the "Version Packages" PR
#   - no changesets, but package versions not yet on npm (i.e. the version PR was just merged)
#                         -> build, pack and publish them via npm trusted publishing (OIDC)
#
# No npm token is used anywhere. Each package must have a trusted publisher configured on npmjs.com
# pointing at TrialAndErrorOrg/parsers + this file (release.yml). See docs/releasing.md.
#
# Layout follows https://changesets.dev/guide/automating (trusted publishing variant): only the
# `publish` job gets `id-token: write`.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.3.0

jobs:
  select-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Create or update the "Version Packages" PR
        uses: changesets/action/version@v2
        env:
          # read by @changesets/changelog-github to link PRs/authors in the changelogs
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Prebuilt binaries of typast-syntax-node, one per platform package
  # (libs/typast/typast-syntax-node/npm/<platform>). Without one, the package falls back to
  # WebAssembly, so a platform missing here still works.
  native:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, platform: darwin-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, platform: darwin-x64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, platform: linux-x64-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-arm64-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: win32-x64-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: libs/typast/typast-syntax-node
        run: pnpm exec napi build --platform --release --target ${{ matrix.target }} --no-js --output-dir npm/${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: typast-syntax-node-${{ matrix.platform }}
          path: libs/typast/typast-syntax-node/npm/${{ matrix.platform }}/*.node
          if-no-files-found: error

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: [select-mode, native]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Put the native binaries into their platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: typast-syntax-node-*
          path: native
      - run: |
          for dir in native/typast-syntax-node-*; do
            cp "$dir"/*.node "libs/typast/typast-syntax-node/npm/${dir#native/typast-syntax-node-}/"
          done
      - name: Build
        run: pnpm build
      # `pnpm pack` per package: rewrites workspace:^ ranges to real versions
      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write # git tags + GitHub releases
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # changesets publishes the packed tarballs with `pnpm publish <tarball>`. pnpm 11 publishes
      # natively (no npm CLI) and exchanges the GitHub OIDC token for a short-lived npm token
      # itself, generating provenance automatically for public packages from a public repo.
      - name: Publish to npm
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
