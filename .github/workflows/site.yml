# Builds the website (apps/site) with the content from TrialAndErrorOrg/site-content, publishes it
# as ghcr.io/trialanderrororg/site and asks Coolify to deploy it. Fast because it keeps every cache
# between runs: pnpm's store, turbo's cache (the libraries the site uses) and the site's own caches
# of resized images, share images and journal article HTML. The image only packages the built
# site, see apps/site/Dockerfile.
#
# Secret: OP_TOKEN, a 1Password service account token. varlock reads everything else from the
# Website vault (apps/site/.env.schema). See apps/site/docs/deploying.md.
name: site

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - libs/sveltia-gateway/**
      # The converter at /admin/convert and the Typst template it puts in its downloads
      - apps/converter/**
      - templates/typst/**
      - pnpm-lock.yaml
      - .github/workflows/site.yml
  # Sent by Strapi when something is published. site-content starts the workflow directly instead
  repository_dispatch:
    types: [content-updated]
  # New journal articles reach Underlay without telling anyone
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions: {}

# Only the newest content matters: a save cancels the build of the one before
concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/trialanderrororg/site
      CONTENT_DIR: ${{ github.workspace }}/site-content
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # What editors change in /admin, see apps/site/src/integrations/content.ts
      - uses: actions/checkout@v7
        with:
          repository: TrialAndErrorOrg/site-content
          path: site-content
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-site-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-site-${{ runner.os }}-
            turbo-${{ runner.os }}-main-

      # Content-addressed, so restoring the newest copy is always safe; each run saves a fresh one
      - name: Restore the site's image and article caches
        uses: actions/cache@v6
        with:
          path: |
            apps/site/node_modules/.astro
            apps/site/node_modules/.cache
          key: site-assets-${{ github.run_id }}
          restore-keys: site-assets-

      # The site's build script runs through varlock, which reads the Strapi and Underlay tokens
      # from 1Password and hides them in the log
      - name: Build
        run: pnpm turbo run build --filter=site... --cache-dir=.turbo/cache
        env:
          OP_TOKEN: ${{ secrets.OP_TOKEN }}

      # The built site plus only its production dependencies, with the musl builds of native
      # packages for the Alpine image
      - name: Package
        run: pnpm --filter site deploy --prod --legacy --os=linux --cpu=x64 --libc=musl "$RUNNER_TEMP/site"

      - name: Build the image
        run: |
          docker build "$RUNNER_TEMP/site" -f apps/site/Dockerfile \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}"

      # Every route the server renders itself, so a runtime package missing from the image's
      # dependencies fails here instead of on the live site. scripts/release.sh runs it too
      - name: Smoke test the image
        run: apps/site/scripts/smoke-test.sh "$IMAGE:${{ github.sha }}"

      - name: Push the image
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$IMAGE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Skipped until COOLIFY_DEPLOY_URL is set in apps/site/.env.schema
      - name: Deploy
        working-directory: apps/site
        run: |
          # shellcheck disable=SC2016 # expanded by the inner shell, after varlock has filled them in
          pnpm exec varlock run -- sh -c '
            if [ -z "$COOLIFY_DEPLOY_URL" ]; then echo "No COOLIFY_DEPLOY_URL, not deploying"; exit 0; fi
            curl --fail --silent --show-error -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_DEPLOY_URL"
          '
        env:
          OP_TOKEN: ${{ secrets.OP_TOKEN }}
