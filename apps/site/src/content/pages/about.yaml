title: About Us
description: Read the vision and mission of the Center of Trial and Error.
showTitle: true
sections:
  - type: text
    body: >-
      The Center of Trial & Error is a virtual platform and sandbox for disruptive initiatives
      that will lead to institutional change.


      With the Journal of Trial & Error as our flagship, we aim to bridge the gap between what
      researchers do and what researchers can report, to discuss and question what kind of
      knowledge is deemed valuable, to advocate for practices that positively impact the lives
      of researchers and the public, and to advance policies that put openness, transparency
      and compassion above profit, division and bottom lines.

  - type: text
    id: mission
    title: Our Mission
    background: accent-soft
    body: >-
      The Center of Trial & Error believes that a more transparent, responsible, honest, and
      reflexive way of doing scholarship requires institutional change. It thereby tries to
      disrupt existing scholarly infrastructures by empowering early career researchers to
      develop and explore the possibilities of non-profit and value-driven platforms for
      academic activities.


      Moreover, the Center aims to provide space for ongoing and independent reflection on
      academic culture, systemic structures, research and academic education and wants to
      connect those who (try to) enforce practical change. To do so, the Center hosts five
      branches around our [Journal](/journal): publishing, training, research, and
      [software development](https://github.com/TrialAndErrorOrg).

  - type: team
    id: team
    title: Meet the Team
