# Mirrors every released package into its own read-only repo, TrialAndErrorOrg/<name>: one
# snapshot commit per release, tagged v<version>. Runs after each release; a run without a new
# release finds nothing to do. See scripts/split.ts and docs/releasing.md.
name: split

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  split:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # GITHUB_TOKEN can't create or push to other repos; the split app can (Administration +
      # Contents write, installed on all of the org's repositories)
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.SPLIT_APP_ID }}
          private-key: ${{ secrets.SPLIT_APP_PRIVATE_KEY }}
          owner: TrialAndErrorOrg
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the `<name>@<version>` release tags
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/split.ts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
