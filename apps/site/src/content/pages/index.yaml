  - type: features
    title: What do we do?
    items:
      - title: Discussing
        body: >-
          We define “trial and error” as methodological flaws and conceptual errors in research.
          The Center facilitates a reflective discussion on these issues with [our blog](/blog)
          and by encouraging empirical research and cross-disciplinary conceptual work.
      - title: Publishing
        body: >-
          We aim to publicize the lessons of research struggles, publish answers to the question
          “what went wrong?”, and independently host non-profit pre-press services. The
          [Journal of Trial and Error](/journal) is dedicated to this mission.
      - title: Training
        body: >-
          Institutional change results from well-equipped young people, creating a mass from
          below. We focus efforts to educate students on the systemic and organisational
          structures of science and scholarship to make change a practical reality.

  - type: newsletter
