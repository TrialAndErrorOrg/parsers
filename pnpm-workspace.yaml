packages:
  - apps/*
  - libs/*
  - libs/*/*
  # Superseded by apps/converter; kept out of the workspace until someone decides its fate.
  - '!apps/converter-frontend'

# Dependency build scripts pnpm may run (pnpm 11 asks for explicit approval).
allowBuilds:
  esbuild: true

# eslint-plugin-regexp is loaded by oxlint as a JS plugin; it never needs eslint itself.
peerDependencyRules:
  ignoreMissing:
    - eslint

patchedDependencies:
  '@unified-latex/unified-latex-builder@1.3.1': patches/@unified-latex__unified-latex-builder@1.3.1.patch
  '@unified-latex/unified-latex-types@1.3.1': patches/@unified-latex__unified-latex-types@1.3.1.patch
  '@unified-latex/unified-latex-util-to-string@1.3.1': patches/@unified-latex__unified-latex-util-to-string@1.3.1.patch

minimumReleaseAgeExclude:
  - '@typescript/typescript-darwin-arm64@7.1.0-dev.20261004.1'
  - '@typescript/typescript-darwin-x64@7.1.0-dev.20261004.1'
  - '@typescript/typescript-linux-arm64@7.1.0-dev.20261004.1'
  - '@typescript/typescript-linux-arm@7.1.0-dev.20261004.1'
  - '@typescript/typescript-linux-x64@7.1.0-dev.20261004.1'
  - '@typescript/typescript-win32-arm64@7.1.0-dev.20261004.1'
  - '@typescript/typescript-win32-x64@7.1.0-dev.20261004.1'
  - typescript@7.1.0-dev.20261004.1
